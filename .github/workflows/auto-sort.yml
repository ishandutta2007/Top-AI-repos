name: Auto-sort table

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Sort table by star count
      env:
        VITE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python sort_table.py

    - name: Fix serial numbers
      run: python fix_serials.py

    - name: Check for changes
      id: diff
      run: |
        git diff --quiet README.md && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      if: steps.diff.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: 'chore: auto-sort table by star count'
        title: 'chore: auto-sort table by star count'
        body: |
          Automated weekly re-sort of the README table by current GitHub star counts.

          Generated by the `auto-sort.yml` workflow.
        branch: auto-sort-table
        delete-branch: true
